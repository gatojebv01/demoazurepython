trigger:
  branches:
    include:
      - main

variables:
  # Azure Container Registry
  dockerRegistryServiceConnection: 'service-to-registry'
  imageRepository: 'jbpwregistrydemo'
  containerRegistry: 'jbpwregistrydemo.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # AWS deployment
  awsRegion: 'us-east-1'
  ecsClusterName: 'py-ecs-cluster-demo1'
  ecsServiceName: 'py-ecs-service-demo1'

  # Azure agent
  vmImageName: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and Push CI Image
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)

        steps:
          - task: UsePythonVersion@0
            displayName: Use Python 3.11
            inputs:
              versionSpec: '3.11'

          - script: |
              set -euo pipefail

              python -m pip install --upgrade pip
              pip install flake8

              flake8 . \
                --count \
                --select=E9,F63,F7,F82 \
                --show-source \
                --statistics
            displayName: Run lint checks

          - task: Docker@2
            displayName: Build and push image to ACR
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest

  - stage: Deploy
    displayName: Deploy to AWS ECS Fargate
    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: Deploy
        displayName: Register task and update service
        pool:
          vmImage: $(vmImageName)

        steps:
          - script: |
              set -euo pipefail

              TASK_DEFINITION_FILE="$(Build.SourcesDirectory)/taskdef.json"
              FULL_IMAGE_URI="$(containerRegistry)/$(imageRepository):$(tag)"

              if [[ ! -f "${TASK_DEFINITION_FILE}" ]]; then
                echo "##vso[task.logissue type=error]taskdef.json was not found."
                exit 1
              fi

              if ! grep -q "IMAGE_PLACEHOLDER" "${TASK_DEFINITION_FILE}"; then
                echo "##vso[task.logissue type=error]IMAGE_PLACEHOLDER was not found in taskdef.json."
                exit 1
              fi

              sed -i \
                "s|IMAGE_PLACEHOLDER|${FULL_IMAGE_URI}|g" \
                "${TASK_DEFINITION_FILE}"

              echo "Deploying image: ${FULL_IMAGE_URI}"
            displayName: Inject image tag

          - script: |
              set -euo pipefail

              echo "Checking AWS authentication..."

              aws sts get-caller-identity \
                --query '{Account:Account,Arn:Arn}' \
                --output table

              echo "Registering task definition..."

              TASK_DEFINITION_ARN=$(
                aws ecs register-task-definition \
                  --cli-input-json \
                  "file://$(Build.SourcesDirectory)/taskdef.json" \
                  --query 'taskDefinition.taskDefinitionArn' \
                  --output text
              )

              echo "Registered task definition: ${TASK_DEFINITION_ARN}"

              aws ecs update-service \
                --cluster "$(ecsClusterName)" \
                --service "$(ecsServiceName)" \
                --task-definition "${TASK_DEFINITION_ARN}" \
                --force-new-deployment

              echo "Waiting for the ECS service to stabilize..."

              aws ecs wait services-stable \
                --cluster "$(ecsClusterName)" \
                --services "$(ecsServiceName)"

              echo "Deployment completed."
            displayName: Authenticate and deploy to ECS
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(awsRegion)