trigger:
  - main # Triggers the pipeline automatically when code is pushed to the main branch

resources:
  - repo: self

variables:
  # Update these with your service connection, registry, and image details
  dockerRegistryServiceConnection: 'service-to-registry'
  imageRepository: 'jbpwregistrydemo'
  containerRegistry: 'jbpwregistrydemo.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)' # Automatically numbers the image version using the build ID

    # AWS Deployment Variables
  awsServiceConnection: 'your-aws-service-connection-name'
  awsRegion: 'us-east-1'
  ecsClusterName: 'py-ecs-cluster-demo'
  ecsServiceName: 'py-ecs-service-demo'
  
  # Agent VM image
  vmImageName: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and Push CI Image
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          # Optional: Lint or test your Python code before building the image
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Use Python 3.11'

          - script: |
              python -m pip install --upgrade pip
              pip install flake8
              # Stop the build if there are Python syntax errors or undefined names
              flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            displayName: 'Run Lint Checks'

          # Build and push the Docker image to Azure Container Registry
          - task: Docker@2
            displayName: Build and Push Image to ACR
            inputs:
              command: 'buildAndPush'
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest
  - stage: Deploy
    displayName: Deploy to AWS ECS Fargate
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Deploy
        pool:
          vmImage: $(vmImageName)
        steps:
          # Replace placeholder with the exact container image URL and Build ID tag
          - script: |
              FULL_IMAGE_URI="$(containerRegistry)/$(imageRepository):$(tag)"
              echo "Injecting image target: $FULL_IMAGE_URI"
              sed -i "s|IMAGE_PLACEHOLDER|$FULL_IMAGE_URI|g" $(Build.SourcesDirectory)/taskdef.json
            displayName: 'Inject Runtime Image Tag into Task Definition'

          # Register the updated task definition to AWS
          - task: AWSCLI@1
            displayName: Register Fargate Task Definition
            inputs:
              awsCredentials: $(awsServiceConnection)
              regionName: $(awsRegion)
              awsCommand: 'ecs'
              awsSubCommand: 'register-task-definition'
              arguments: '--cli-input-json file://$(Build.SourcesDirectory)/taskdef.json'
          
          # Force Fargate to pick up the updated configuration and cycle containers smoothly
          - task: AWSCLI@1
            displayName: Force Deploy Service Update to Fargate
            inputs:
              awsCredentials: $(awsServiceConnection)
              regionName: $(awsRegion)
              awsCommand: 'ecs'
              awsSubCommand: 'update-service'
              arguments: '--cluster $(ecsClusterName) --service $(ecsServiceName) --task-definition python-demo-task --force-new-deployment'
