trigger:
  branches:
    include:
      - main

variables:
  ecrRepository: 'demo/py-ecr-demo'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  awsRegion: 'us-east-1'
  ecsClusterName: 'py-ecs-cluster-demo'
  ecsServiceName: 'py-ecs-service-demo'

  vmImageName: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Validate, build, and push to ECR
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)

        steps:
          - task: UsePythonVersion@0
            displayName: Use Python 3.11
            inputs:
              versionSpec: '3.11'

          - script: |
              set -euo pipefail

              python -m pip install --upgrade pip
              pip install flake8
              flake8 . \
                --count \
                --select=E9,F63,F7,F82 \
                --show-source \
                --statistics
            displayName: Run lint checks

          - script: |
              set -euo pipefail

              ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
              ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
              IMAGE_URI="${ECR_REGISTRY}/$(ecrRepository):$(tag)"

              echo "Verifying ECR repository $(ecrRepository)..."
              aws ecr describe-repositories \
                --repository-names "$(ecrRepository)" \
                --region "${AWS_DEFAULT_REGION}" \
                --output table

              echo "Authenticating Docker to ${ECR_REGISTRY}..."
              aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
                | docker login \
                    --username AWS \
                    --password-stdin "${ECR_REGISTRY}"

              echo "Building ${IMAGE_URI}..."
              docker build \
                --file "$(dockerfilePath)" \
                --tag "${IMAGE_URI}" \
                "$(Build.SourcesDirectory)"

              docker push "${IMAGE_URI}"

              echo "Verifying pushed image..."
              aws ecr describe-images \
                --repository-name "$(ecrRepository)" \
                --image-ids "imageTag=$(tag)" \
                --region "${AWS_DEFAULT_REGION}" \
                --query 'imageDetails[0].{Digest:imageDigest,Tags:imageTags}' \
                --output table
            displayName: Build and push image to ECR
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(awsRegion)

  - stage: Deploy
    displayName: Deploy to AWS ECS Fargate
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Deploy
        displayName: Register task and update service
        pool:
          vmImage: $(vmImageName)

        steps:
          - script: |
              set -euo pipefail

              TASK_DEFINITION_FILE="$(Build.SourcesDirectory)/taskdef.json"
              ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
              ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
              FULL_IMAGE_URI="${ECR_REGISTRY}/$(ecrRepository):$(tag)"

              if [[ ! -f "${TASK_DEFINITION_FILE}" ]]; then
                echo "##vso[task.logissue type=error]taskdef.json was not found."
                exit 1
              fi

              if ! grep -q "IMAGE_PLACEHOLDER" "${TASK_DEFINITION_FILE}"; then
                echo "##vso[task.logissue type=error]IMAGE_PLACEHOLDER was not found in taskdef.json."
                exit 1
              fi

              if jq -e '.containerDefinitions[] | has("repositoryCredentials")' \
                "${TASK_DEFINITION_FILE}" >/dev/null; then
                echo "##vso[task.logissue type=error]Remove repositoryCredentials from taskdef.json when using ECR."
                exit 1
              fi

              sed -i \
                "s|IMAGE_PLACEHOLDER|${FULL_IMAGE_URI}|g" \
                "${TASK_DEFINITION_FILE}"

              echo "Registering task definition for ${FULL_IMAGE_URI}..."
              TASK_DEFINITION_ARN=$(
                aws ecs register-task-definition \
                  --cli-input-json "file://${TASK_DEFINITION_FILE}" \
                  --query 'taskDefinition.taskDefinitionArn' \
                  --output text
              )

              echo "Registered ${TASK_DEFINITION_ARN}"

              aws ecs update-service \
                --cluster "$(ecsClusterName)" \
                --service "$(ecsServiceName)" \
                --task-definition "${TASK_DEFINITION_ARN}" \
                --force-new-deployment \
                --output table

              echo "Waiting for the ECS service to stabilize..."
              aws ecs wait services-stable \
                --cluster "$(ecsClusterName)" \
                --services "$(ecsServiceName)"

              echo "Deployment completed."
            displayName: Register task definition and deploy
            env:
              AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
              AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
              AWS_DEFAULT_REGION: $(awsRegion)
