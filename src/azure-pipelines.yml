trigger:
  - main # Triggers the pipeline automatically when code is pushed to the main branch

resources:
  - repo: self

variables:
  # Update these with your service connection, registry, and image details
  dockerRegistryServiceConnection: 'service-to-registry'
  imageRepository: 'jbpwregistrydemo'
  containerRegistry: 'jbpwregistrydemo.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)' # Automatically numbers the image version using the build ID

    # AWS Deployment Variables
  awsServiceConnection: 'your-aws-service-connection-name'
  awsRegion: 'us-east-1'
  ecsClusterName: 'py-ecs-cluster-demo'
  ecsServiceName: 'py-ecs-service-demo'
  
  # Agent VM image
  vmImageName: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and Push CI Image
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          # Optional: Lint or test your Python code before building the image
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
            displayName: 'Use Python 3.11'

          - script: |
              python -m pip install --upgrade pip
              pip install flake8
              # Stop the build if there are Python syntax errors or undefined names
              flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
            displayName: 'Run Lint Checks'

          # Build and push the Docker image to Azure Container Registry
          - task: Docker@2
            displayName: Build and Push Image to ACR
            inputs:
              command: 'buildAndPush'
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                latest
 - stage: Deploy
  displayName: Deploy to AWS ECS Fargate
  dependsOn: Build
  jobs:
    - job: Deploy
      pool:
        vmImage: ubuntu-latest

      steps:
        - script: |
            set -euo pipefail

            FULL_IMAGE_URI="$(containerRegistry)/$(imageRepository):$(tag)"

            sed -i \
              "s|IMAGE_PLACEHOLDER|${FULL_IMAGE_URI}|g" \
              "$(Build.SourcesDirectory)/taskdef.json"
          displayName: Inject image tag

        - script: |
            set -euo pipefail

            echo "Checking AWS authentication..."
            aws sts get-caller-identity \
              --query '{Account:Account,Arn:Arn}' \
              --output table

            echo "Registering task definition..."
            TASK_DEFINITION_ARN=$(
              aws ecs register-task-definition \
                --cli-input-json \
                "file://$(Build.SourcesDirectory)/taskdef.json" \
                --query 'taskDefinition.taskDefinitionArn' \
                --output text
            )

            echo "Registered: ${TASK_DEFINITION_ARN}"

            aws ecs update-service \
              --cluster "$(ecsClusterName)" \
              --service "$(ecsServiceName)" \
              --task-definition "${TASK_DEFINITION_ARN}" \
              --force-new-deployment

            aws ecs wait services-stable \
              --cluster "$(ecsClusterName)" \
              --services "$(ecsServiceName)"
          displayName: Authenticate and deploy to ECS
          env:
            AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
            AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
            AWS_DEFAULT_REGION: $(awsRegion)